      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
    <script>
      // Gracefully prevent benign Vite HMR WebSocket connection errors from bubbling as unhandled rejections
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && typeof event.reason.message === 'string') {
          if (event.reason.message.includes('WebSocket') || event.reason.message.includes('websocket')) {
            event.preventDefault();
          }
        }
      });
    </script>

  </body>
